tests:
  # R01
  - {id: R01-a, rule: R01_QUOTE_FRESHNESS, desc: "fixture: market open, ages 1-2 min", expect: {result: PASS}}
  - {id: R01-b, rule: R01_QUOTE_FRESHNESS, desc: "leg-2 bid 16 min old", set: {legs.1.bid.as_of: "2026-10-14T10:44:00-04:00"}, expect: {result: VETO, measured: {max_age_min: 16.0}}}
  - {id: R01-c, rule: R01_QUOTE_FRESHNESS, desc: "age exactly 15:00 is inclusive", set: {legs.1.bid.as_of: "2026-10-14T10:45:00-04:00"}, expect: {result: PASS, measured: {max_age_min: 15.0}}}
  - {id: R01-d, rule: R01_QUOTE_FRESHNESS, desc: "premarket 08:00 ET: market closed", set: {evaluated_at: "2026-10-14T08:00:00-04:00", underlying.last.as_of: "2026-10-14T07:59:00-04:00"}, expect: {result: VETO}}
  - {id: R01-e, rule: R01_QUOTE_FRESHNESS, desc: "underlying last missing", set: {underlying.last: {value: null, status: missing, as_of: null}}, expect: {result: UNKNOWN}}
  - {id: R01-f, rule: R01_QUOTE_FRESHNESS, desc: "DST gap week: 14:35 Berlin (+01:00) = 09:35 NY (EDT) -> open; naive Berlin-6h would say closed", set: {evaluated_at: "2026-10-26T14:35:00+01:00", underlying.last.as_of: "2026-10-26T09:34:00-04:00", legs.0.bid.as_of: "2026-10-26T09:34:00-04:00", legs.0.ask.as_of: "2026-10-26T09:34:00-04:00", legs.1.bid.as_of: "2026-10-26T09:34:00-04:00", legs.1.ask.as_of: "2026-10-26T09:34:00-04:00"}, expect: {result: PASS}}
  - {id: R01-g, rule: R01_QUOTE_FRESHNESS, desc: "stale status vetoes even if timestamp recent", set: {legs.0.ask.status: stale}, expect: {result: VETO}}
  # R02
  - {id: R02-a, rule: R02_BID_ASK_WIDTH, desc: "5.6% and 6.7%", expect: {result: PASS}}
  - {id: R02-b, rule: R02_BID_ASK_WIDTH, desc: "leg-2 2.70/3.10 = 13.79%", set: {legs.1.bid.value: 2.70}, expect: {result: VETO}}
  - {id: R02-c, rule: R02_BID_ASK_WIDTH, desc: "exactly 10% (2.85/3.15) passes; no float error", set: {legs.1.bid.value: 2.85, legs.1.ask.value: 3.15}, expect: {result: PASS}}
  - {id: R02-d, rule: R02_BID_ASK_WIDTH, desc: "crossed quote ask<bid", set: {legs.1.bid.value: 3.20}, expect: {result: UNKNOWN}}
  - {id: R02-e, rule: R02_BID_ASK_WIDTH, desc: "one leg vetoes, other missing -> VETO wins", set: {legs.1.bid.value: 2.70, legs.0.ask: {value: null, status: missing, as_of: null}}, expect: {result: VETO}}
  # R03
  - {id: R03-a, rule: R03_OPEN_INTEREST, desc: "800/900", expect: {result: PASS}}
  - {id: R03-b, rule: R03_OPEN_INTEREST, desc: "leg-1 OI 499", set: {legs.0.open_interest.value: 499}, expect: {result: VETO}}
  - {id: R03-c, rule: R03_OPEN_INTEREST, desc: "OI exactly 500 inclusive", set: {legs.0.open_interest.value: 500}, expect: {result: PASS}}
