# Deterministic Risk Officer rules for the PAPER-ONLY US options app.
# Human-readable companion: risk_rules.md. Reference implementation: risk_reference.py.
# All quoted: never let YAML auto-convert timestamps/dates.
ruleset_version: "1.1.1"   # 1.1.1: R04 max loss for verticals from the INV-14 formula (verticals.py); 1.1.0: R11 sector cap, R12 defined-risk structure, R13 hold period, profiles.demo

config:
  # --- placeholders pending Eugene: keep labelled until he confirms ---
  per_trade_max_loss_usd: 500          # PLACEHOLDER pending Eugene
  max_underlying_risk_usd: 1000        # PLACEHOLDER pending Eugene (R11)
  max_total_open_risk_usd: 2000        # PLACEHOLDER pending Eugene (R11)
  max_open_positions: 5                # PLACEHOLDER pending Eugene (R11)
  placeholders: [per_trade_max_loss_usd, max_underlying_risk_usd, max_total_open_risk_usd, max_open_positions]
  # --- defaults ---
  quote_max_age_seconds: 900           # 15 min
  quote_future_tolerance_seconds: 60   # as_of more than this in the future = invalid -> UNKNOWN
  max_spread_pct_of_mid: "0.10"        # string -> exact Decimal
  min_open_interest: 500
  min_dte: 7
  net_price_basis: mid                 # mid | natural
  fees_per_contract_usd: "0"
  macro_event_kinds: [CPI, PPI, FOMC, NFP]
  min_put_extrinsic: "0.05"            # R09 short-put FLAG threshold
  iv_min_history_obs: 20
  iv_rank_high: "0.80"                 # debit tickets FLAG above
  iv_rank_low: "0.20"                  # credit tickets FLAG below
  contract_multiplier: 100
  # --- v1.1 defaults (no profile) ---
  max_sector_risk_usd: null            # null = sector cap not checked (R11); set by a profile
  sector_map: {}                       # underlying -> sector (R11 sector cap); empty by default
  allowed_structures: [long_call, long_put, bull_call_debit_spread, bear_put_debit_spread, bull_put_credit_spread, bear_call_credit_spread, iron_condor]   # R12: defined-risk only; naked short options always VETO
  hold_min_days: 7                     # R13: time stop and DTE must be >= this (NY calendar days)
  hold_max_days: null                  # R13: null = no upper bound by default
  tick_rules:                          # v1.1 INV-13 (session validator) - option price tick grid
    # PLACEHOLDER list - verify against the current Cboe/OCC penny program list before relying on it.
    penny_pilot: [SPY, QQQ, IWM, JPM]
    threshold: "3.00"                  # tier chosen by the RAW price
    penny_ticks: ["0.01", "0.05"]      # below / at-or-above threshold
    standard_ticks: ["0.05", "0.10"]
    directions:                        # INV-13; credit directions enforced for schema 1.1.1 / 1.1.2 records only
      debit: {limit: down, stop: up, target: down}    # pay at most; stop and target trigger no later than the raw level
      credit: {limit: up, stop: down, target: up}     # receive at least; stop and target (buy-back cost) trigger no later than raw
  market_hours:
    timezone: America/New_York         # ALWAYS compute here; Berlin is display only
    open: "09:30"
    close: "16:00"
    early_close: "13:00"
    # NYSE 2026 calendar - verify against nyse.com/markets/hours-calendars before production use
    holidays: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25"]
    early_closes: ["2026-11-27", "2026-12-24"]

# ---------------------------------------------------------------------------
# Named profiles: evaluate(..., profile="demo") applies config_overrides on top of the defaults above.
# The defaults (incl. the PLACEHOLDER limits 500/1000/2000/5) stay the documented baseline.
profiles:
  demo:
    label: "DEMO - fictional scenario, values relayed by agent Moodle, not confirmed by Eugene directly"
    confirmed_by_eugene: false
    broker_display: "Harborline Securities"   # fictional, display only; no broker connection, paper only
    paper_account_equity_usd: 25000
    max_risk_per_idea_pct: 2                  # 2% of 25000 = 500 -> R04 per_trade_max_loss_usd
    max_risk_per_sector_pct: 6                # 1500
    max_total_open_risk_pct: 10               # 2500
    watchlist: [JPM, WDC, AAPL, MSFT, NVDA, XOM]
    config_overrides:
      per_trade_max_loss_usd: 500             # R04 (= 2% of equity)
      max_open_positions: 5                   # R11: max open ideas
      max_underlying_risk_usd: 500            # R11: = one idea per underlying
      max_sector_risk_usd: 1500               # R11: 6% of equity
      max_total_open_risk_usd: 2500           # R11: 10% of equity
      allowed_structures: [bull_call_debit_spread, bear_put_debit_spread, bull_put_credit_spread, bear_call_credit_spread]   # R12: defined-risk debit/credit spreads only
      hold_min_days: 7                        # R13
      hold_max_days: 28                       # R13
      sector_map: {JPM: Financial, WDC: Technology, AAPL: Technology, MSFT: Technology, NVDA: Technology, XOM: Energy}

result_precedence: [VETO, UNKNOWN, FLAG, PASS]   # combining per-leg / per-item results inside one rule

overall:
  verdict: "VETO if any rule result is VETO or any HARD rule is UNKNOWN; else FLAG if any FLAG or any SOFT rule UNKNOWN; else PASS"
  approval_required: true   # always, even on PASS; approval is contract-level (exact legs, qty, limit) and expires
  approvable_verdicts: [PASS, FLAG]   # FLAG requires approver to acknowledge each flagged rule_id

common_definitions:
  usable_field: "status in {ok, stale} and value is not null. missing/conflicting/absent = unusable -> rule UNKNOWN (unless a definite VETO is found elsewhere in the same rule)."
  point_in_time: "A Field is visible to a review only if its source.fetched_at <= evaluated_at; otherwise treated as missing."
  mid: "(bid + ask) / 2 using exact decimal arithmetic. Leg quote invalid (-> UNKNOWN) if bid < 0, ask <= 0, or ask < bid."
  window: "window_start = max(evaluated_at, ticket.hold_window.start); window_end = min(ticket.hold_window.end, earliest leg expiry at market close NY). Inclusive at both ends."
  event_interval: "earnings/macro: bmo -> [D 09:30 NY]; amc -> [D 16:00 NY]; during_market/at_time -> [scheduled_at]; unknown -> [D 00:00, D 23:59:59 NY]. In window iff interval overlaps window (inclusive)."
  exdiv_exposure_instant: "market close (NY) of the trading day before the ex-date (holidays/weekends skipped). Ex-div is 'in window' iff this instant is within the window."
  coverage: "For a (kind, underlying) the calendar must have a usable coverage.checked_through >= window_end NY date; otherwise the rule is UNKNOWN for that kind."
  dte: "(leg.expiry - evaluated_at converted to America/New_York date).days; ticket DTE = min over legs."

rules:
  - id: R01_QUOTE_FRESHNESS
    severity: hard
    description: Underlying and every leg quote must be live (<= 15 min old) and the US regular session must be open.
    inputs: [evaluated_at, underlying.last, "legs[].bid", "legs[].ask", config.market_hours]
    formula: "age_s = evaluated_at - as_of (seconds) for each of underlying.last, legs[].bid, legs[].ask; measured = max age in minutes"
    threshold: {quote_max_age_seconds: 900}
    result_logic:
      VETO: "market closed at evaluated_at (America/New_York); OR any item status=stale; OR any age_s > 900"
      UNKNOWN: "any item unusable or as_of null; OR as_of more than 60 s in the future"
      PASS: "market open and every age_s <= 900"
  - id: R02_BID_ASK_WIDTH
    severity: hard
    description: Each leg's bid-ask width must be <= 10% of its mid.
    inputs: ["legs[].bid", "legs[].ask"]
    formula: "width_pct = (ask - bid) / ((bid + ask) / 2), per leg, exact decimal"
    threshold: {max_spread_pct_of_mid: "0.10"}
    result_logic:
      VETO: "any leg width_pct > 0.10"
      UNKNOWN: "any leg bid/ask unusable or invalid (ask < bid, ask <= 0, bid < 0, mid = 0)"
      PASS: "every leg width_pct <= 0.10"
  - id: R03_OPEN_INTEREST
    severity: hard
    description: Each leg must have open interest >= 500.
    inputs: ["legs[].open_interest"]
    formula: "oi per leg"
    threshold: {min_open_interest: 500}
    result_logic:
      VETO: "any leg oi < 500"
      UNKNOWN: "any leg oi unusable"
      PASS: "every leg oi >= 500"
  - id: R04_MAX_LOSS
    severity: hard
    placeholder: true
    description: Ticket max loss at its limit price must be <= the per-trade limit (default $500, PLACEHOLDER pending Eugene).
    inputs: ["legs[] (type, side, strike, expiry, ratio)", ticket.quantity, ticket.limit_price, config.fees_per_contract_usd]
    formula: >-
      Expiry payoff per unit P(S) = sum(sign * ratio * intrinsic(S)) - premium, sign=+1 buy/-1 sell,
      premium = +limit for debit, -limit for credit. Total PnL(S) = 100 * quantity * P(S) - fees.
      max_loss = -min(PnL(S)) over S in {0} U strikes (piecewise linear); unlimited if the net call ratio
      (sum sign*ratio over calls) < 0 (loss grows as S -> infinity). fees = fees_per_contract * quantity * sum(ratio).
    threshold: {per_trade_max_loss_usd: 500}
    result_logic:
      VETO: "unlimited, or max_loss > per_trade_max_loss_usd"
      UNKNOWN: "limit price missing, threshold null, or legs with different expiries (multi-expiry payoff unsupported in v1)"
      PASS: "max_loss <= per_trade_max_loss_usd"
  - id: R05_NET_PRICE_VS_LIMIT
    severity: hard
    description: Current net debit (mid basis) must be <= the ticket limit; for credit tickets net credit must be >= the limit.
    inputs: ["legs[].bid", "legs[].ask", "legs[].side", "legs[].ratio", ticket.limit_price]
    formula: "net = sum(buy ratio*px) - sum(sell ratio*px), px = mid (or ask for buys / bid for sells if net_price_basis=natural); debit positive"
    threshold: {source: ticket.limit_price.amount, net_price_basis: mid}
    result_logic:
      VETO: "debit: net > limit; credit: -net < limit"
      UNKNOWN: "any leg quote unusable/invalid"
      PASS: "debit: net <= limit; credit: -net >= limit"
  - id: R06_MIN_DTE
    severity: hard
    description: Every leg must have >= 7 calendar days to expiry (NY date).
    inputs: ["legs[].expiry", evaluated_at]
    formula: "dte = min over legs of (expiry - date_NY(evaluated_at)).days"
    threshold: {min_dte: 7}
    result_logic:
      VETO: "dte < 7"
      UNKNOWN: "no legs"
      PASS: "dte >= 7"
  - id: R07_EARNINGS_IN_WINDOW
    severity: hard
    description: No earnings for the underlying inside the hold window unless the ticket marks that event intended.
    inputs: ["events[kind=earnings, underlying=ticket.underlying]", "coverage[kind=earnings, underlying]", ticket.hold_window, ticket.intended_event_ids]
    formula: "for each earnings event: in_window(event_interval); coverage check"
    threshold: {window: common_definitions.window}
    result_logic:
      VETO: "an earnings event in window and not in intended_event_ids"
      UNKNOWN: "coverage missing/short of window_end, or an event's scheduled_at unusable"
      FLAG: "every in-window earnings event is intended (approver must acknowledge)"
      PASS: "coverage ok and no earnings in window"
  - id: R08_MACRO_EVENTS
    severity: soft
    description: Scheduled CPI, PPI, FOMC, NFP inside the hold window are flagged.
    inputs: ["events[kind in macro_event_kinds]", "coverage[kind in macro_event_kinds, underlying=null]", ticket.hold_window]
    formula: "for each macro kind: coverage check; each event: in_window(event_interval)"
    threshold: {macro_event_kinds: [CPI, PPI, FOMC, NFP]}
    result_logic:
      UNKNOWN: "any macro kind's coverage missing/short, or an event's scheduled_at unusable"
      FLAG: "any macro event in window"
      PASS: "all kinds covered, none in window"
  - id: R09_EARLY_ASSIGNMENT
    severity: hard
    description: Short legs must not carry early-assignment risk (short call ITM with ex-dividend in window, or short call extrinsic < dividend with ex-dividend in window).
    inputs: ["legs[side=sell]", underlying.last, "legs[].bid/ask", "events[kind=ex_dividend]", "coverage[kind=ex_dividend, underlying]"]
    formula: >-
      Short call: intrinsic = max(0, S - K); extrinsic = mid - intrinsic; exdiv_in_window via exdiv_exposure_instant.
      Short put: intrinsic = max(0, K - S); extrinsic = mid - intrinsic.
    threshold: {min_put_extrinsic: "0.05"}
    result_logic:
      VETO: "short call with ex-div in window AND (S > K OR extrinsic < dividend)"
      FLAG: "short call with ex-div in window, OTM and extrinsic >= dividend; OR short put ITM with extrinsic < min_put_extrinsic"
      UNKNOWN: "short call present and ex-div coverage missing/short or ex-div event date/dividend unusable; or S / leg quote unusable when needed"
      PASS: "no short legs, or none of the above"
  - id: R10_IV_VS_HISTORY
    severity: soft
    description: Compare current IV30 with its trailing 30-day history (IV rank).
    inputs: [iv.iv30_current, iv.iv30_history, ticket.limit_price.price_type]
    formula: "iv_rank = (cur - min(hist)) / (max(hist) - min(hist)); 0.5 if max == min"
    threshold: {iv_rank_high: "0.80", iv_rank_low: "0.20", iv_min_history_obs: 20}
    result_logic:
      UNKNOWN: "cur or history unusable, or len(history) < 20"
      FLAG: "debit and iv_rank > 0.80 (buying rich vol); credit and iv_rank < 0.20 (selling cheap vol)"
      PASS: "otherwise"
  - id: R11_CONCENTRATION
    severity: soft
    placeholder: true
    description: Position concentration across open paper positions (per underlying, per sector, total, count). Default limits are PLACEHOLDERS; profiles.demo sets fictional demo limits.
    inputs: [open_positions, ticket.underlying, "R04 max_loss", config.sector_map]
    formula: >-
      same = sum(max_loss of open positions in underlying) + ticket max_loss; total = sum(all) + ticket max_loss; count = n_open + 1;
      if max_sector_risk_usd is set: sector = sector_map[underlying] (open position may carry its own `sector`),
      same_sector = sum(max_loss of open positions in that sector) + ticket max_loss
    threshold: {max_underlying_risk_usd: 1000, max_sector_risk_usd: null, max_total_open_risk_usd: 2000, max_open_positions: 5}
    result_logic:
      UNKNOWN: "open_positions unusable; or sector cap configured and the ticket's or an open position's underlying has no sector"
      FLAG: "same > max_underlying_risk_usd or same_sector > max_sector_risk_usd or total > max_total_open_risk_usd or count > max_open_positions or ticket max loss unlimited"
      PASS: "otherwise"
  - id: R12_DEFINED_RISK_STRUCTURE
    severity: hard
    description: Only defined-risk structures from config.allowed_structures; the legs must actually form the declared strategy. Naked short options are always VETO.
    inputs: [ticket.strategy, "legs[] (type, side, strike, expiry, ratio)", ticket.limit_price.price_type, config.allowed_structures]
    formula: >-
      naked = for calls or puts, sum(sign*ratio) < 0 (sign +1 buy / -1 sell).
      Vertical shape: 2 legs, same type/expiry/ratio, one buy + one sell, different strikes;
      bull_call_debit buys the lower call, bear_put_debit buys the higher put, bull_put_credit buys the lower put,
      bear_call_credit buys the higher call; price_type must be debit for *_debit_spread and credit for *_credit_spread.
      long_call/long_put = 1 bought leg, debit. iron_condor = bull put credit + bear call credit, one expiry, credit.
    threshold: {allowed_structures: config.allowed_structures}
    result_logic:
      VETO: "naked short option; OR strategy not in allowed_structures; OR legs/price_type do not match the declared strategy"
      UNKNOWN: "no legs or ticket.strategy missing"
      PASS: "allowed, defined-risk, legs match"
  - id: R13_HOLD_PERIOD
    severity: hard
    description: Planned hold (time stop = hold_window.end) and DTE must both sit in [hold_min_days, hold_max_days] NY calendar days, and the time stop must not be after the earliest leg's expiry close.
    inputs: [evaluated_at, ticket.hold_window_start, ticket.hold_window_end, "legs[].expiry", config.market_hours]
    formula: "hold_days = date_NY(hold_window_end) - date_NY(max(evaluated_at, hold_window_start)); dte = min over legs (expiry - date_NY(evaluated_at))"
    threshold: {hold_min_days: 7, hold_max_days: null}
    result_logic:
      VETO: "hold_days or dte < hold_min_days or > hold_max_days (if set); OR hold_window_end after 16:00 NY (13:00 early close) of the earliest expiry"
      UNKNOWN: "no legs, or hold_min_days not configured"
      PASS: "otherwise"

# ---------------------------------------------------------------------------
# Test fixture: a ticket that PASSES every rule. Each test applies set/append/remove on a deep copy.
# Paths are dot-separated; integers index lists.
