# Pipeline settings. Owner: Moodle (structure) / Eugene (values).
# Demo scenario: broker, style, watchlist and account values are FICTIONAL.
# Proposed repo: optpipe-agentdesk (not created). Fictional paper account: $25,000.
mode: paper_only            # the ONLY supported mode. There is no broker integration and no order path.

user:
  name: Eugene Ward
  display_timezone: Europe/Berlin

broker:
  name: Harborline Securities (FICTIONAL)   # demo scenario only; never connected, never used to send anything
trade_style: "defined-risk debit and credit spreads, 1-4 week holds, max 2% account risk per idea"   # FICTIONAL demo persona
watchlist: [JPM, WDC, AAPL, MSFT, NVDA, XOM]   # FICTIONAL demo persona
sectors: [Financial, Technology, Energy]   # FICTIONAL demo persona
scenario:                    # FICTIONAL demo scenario -> "FICTIONAL DEMO" tag on CLI, Markdown and dashboard
  name: demo
  fictional: true
  repo_name: optpipe-agentdesk   # PROPOSAL only: no GitHub/remote repo is created
  account_size_usd: 25000        # fictional paper account
  max_risk_per_idea_pct: 2       # planner max loss per idea = 25000 x 2% = $500 (must equal R04 per_trade_max_loss_usd)
  risk_profile: demo             # Doodle's risk_rules.yaml profiles.demo (sector caps, R12 structures, R13 7-28 d holds)

# Doodle's spec folder (schema, risk rules, test cases). Loaded read-only from code, never copied.
# Override with env OPTIONS_SPEC_DIR.
spec_dir: ../trading/spec

market:
  timezone: America/New_York
  open_time: "09:30"
  entry_not_before: "09:45"

discovery:
  screens: [ta_unusualvolume, ta_topgainers, ta_toplosers, ta_newhigh, ta_newlow]
  finviz_filters: sh_avgvol_o1000,sh_opt_option,sh_price_o10
  max_candidates: 4
  global_indexes: [Nikkei225, TOPIX, KOSPI, HangSeng, Shanghai, Taiex, ASX200, STOXX600, DAX, CAC40, FTSE100]

http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
  timeout_s: 20

providers:
  quotes: nasdaq            # future: eodhd, broker_readonly
  options: nasdaq

research:
  strike_window_pct: 10     # keep strikes within +/-10% of spot in the session record

planner:
  max_risk_per_trade_usd: null  # null = size to the Risk Officer's per_trade_max_loss_usd (spec: 500, PLACEHOLDER)
  preferred_dte_min: 14
  preferred_dte_max: 45
  strike_step: 5
  spread_width: 10
  stop_fraction_of_debit: 0.5
  target_multiple_of_debit: 2.0
  entry_slippage_pct: 2.5
  time_stop_days_before_expiry: 3
  # Tick-size rounding comes from Doodle's spec (risk_rules.yaml config.tick_rules, spec 1.1.0): tiers,
  # penny-pilot list and directions. The two keys below are a FALLBACK used only if the spec has no tick_rules.
  # PLACEHOLDER list (spec's too) - verify against the current Cboe/OCC penny program list before relying on it.
  penny_pilot: [SPY, QQQ, IWM, JPM]
  tick_threshold: 3.0

# Macro calendars (R08) and the risk-free rate for derived IV. Read-only GETs in --live mode, cached under
# cache_dir with a TTL; fixture runs read <fixtures>/macro_calendars.yaml instead (no network).
# BLS: bls.gov returns 403 unless the User-Agent carries a contact email (Doodle, spec bls_release_sources.md).
# Live runs send `optpipe/1.1 (calendar fetch; contact: <bls_contact_email>)` for ONE GET of bls.ics.
# bls_contact_email is EMPTY on purpose: while empty, BLS is not contacted and CPI/PPI/NFP come from FRED's
# public release calendar (rid 10 CPI, 46 PPI, 50 Employment Situation; times listed in US Central Time).
sources:
  cache_dir: var/cache
  cache_ttl_hours: 12
  fomc_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  bls_contact_email: ""          # e.g. set locally to an address you monitor; empty = skip BLS
  bls_ics_url: https://www.bls.gov/schedule/news_release/bls.ics
  fred_calendar_url: "https://fred.stlouisfed.org/releases/calendar?rid={rid}&y={year}"
  fred_release_ids: {CPI: 10, PPI: 46, NFP: 50}
  treasury_tenor: "13 WEEKS COUPON EQUIVALENT"   # home.treasury.gov Daily Treasury Bill Rates

# Derived IV (Black-Scholes from chain mids). R10 needs min_history_points daily observations.
iv:
  min_history_points: 20
  target_days: 30
  state_dir: var/state

# Overrides on top of Doodle's spec/risk_rules.yaml `config` (the spec file itself is never edited).
# Each override is recorded in every risk review's `config_overrides`. The spec's own PLACEHOLDERS,
# all pending Eugene:
#   per_trade_max_loss_usd: 500      max_underlying_risk_usd: 1000
#   max_total_open_risk_usd: 2000    max_open_positions: 5
# Also unconfirmed in the spec: NYSE 2026 holidays/early closes (market_hours).
risk_overrides: {}
