[project]
name = "optpipe"
version = "0.1.0"
license = "MIT"
description = "Paper-only options research pipeline (Moodle / Doodle / Poodle multi-agent project). No broker, no orders."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "datamodel-code-generator>=0.25", "httpx>=0.27"]
docs = ["playwright>=1.40"]

[project.scripts]
optpipe = "optpipe.cli:main"

[build-system]
requires = ["setuptools>=77"]          # PEP 639 `license = "MIT"`
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optpipe.dashboard" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "live: hits real read-only market-data endpoints; skipped unless run with `-m live` or OPTPIPE_LIVE_TESTS=1 (never in CI)",
    "live_spec: compares with Doodle's live ../trading/spec; skipped unless `-m live_spec` or OPTPIPE_LIVE_SPEC_TESTS=1, and in CI mode or when the folder is absent",
]
