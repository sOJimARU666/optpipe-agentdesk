# CI for the private GitHub repo: runs on every push and pull request (any base branch) and on manual dispatch.
# PAPER ONLY: nothing here talks to a broker; all tests run offline from fixtures.
name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # spec/ is the pinned copy of Doodle's spec (scripts/sync_spec.py: VERSION 1.1.8 + MANIFEST sha256 0837c74c..., 191 files).
  # Doodle owns it; changes go through Doodle in ../trading/spec and a re-sync, never an edit here.
  OPTIONS_SPEC_DIR: ${{ github.workspace }}/spec
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historical R7 receipt audit needs its immutable commit offline.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pinned spec intact (manifest sha matches the pin, no file edited, nothing extra)
        run: python scripts/sync_spec.py --check --dest "$OPTIONS_SPEC_DIR"
      - name: Install
        run: |
          pip install -e '.[dev]'
          pip install pyyaml jsonschema pytest       # Doodle's spec tests' deps: installed here, before the guard is on
      # From here on every step runs under the runtime network guard (SOL-ACCEPT-001 G9 follow-up): tests/netguard's
      # sitecustomize.py installs it in every Python process when OPTPIPE_NETGUARD=1. $GITHUB_ENV applies to the
      # LATER steps only, so checkout, setup-python, the first pin check and Install are unguarded. tests/netguard
      # goes first (its sitecustomize chains to any other one); an existing PYTHONPATH is kept after it.
      - name: Network guard on for every later step
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tests/netguard${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          echo "OPTPIPE_NETGUARD=1" >> "$GITHUB_ENV"
      - name: Network guard blocks a test connection (socket, urllib GET, requests GET to 127.0.0.1:9)
        run: python tests/netguard/ci_check_blocked.py   # exit 0 only if every attempt raises NetworkBlocked
      - name: Paper-only scan (structural - no broker, no order path, GET-only HTTP and dashboard)
        run: python -m pytest tests/test_paper_only.py -p no:cacheprovider
      - name: Generated models match the schemas
        run: python scripts/gen_models.py --check
      - name: spec_patches/v1.1 matches the locked spec + ruling 5
        run: python scripts/make_spec_patch.py --check
      - name: Verify historical R7 receipt against its recorded snapshot
        run: python -m pytest tests/r7_history_audit.py -p no:cacheprovider
      - name: Test suite (offline)
        run: python -m pytest -p no:cacheprovider          # `live`-marked tests are skipped (opt-in only)
      - name: Doodle's spec tests
        working-directory: ${{ env.OPTIONS_SPEC_DIR }}
        run: |
          # deps installed in Install (pip is not run under the network guard)
          # spec 1.1.8 is hermetic (fixtures vendored under spec/fixtures/): no sibling checkout or link needed
          python -m pytest -p no:cacheprovider       # 911 passed on spec 1.1.8
      - name: CLI fixture run validates (schema 1.1.6 with Doodle's validator, INV-01..17)
        run: |
          optpipe run --out "$RUNNER_TEMP/out"
          optpipe validate "$RUNNER_TEMP/out/session-2026-10-13.json"
      - name: Spec still pinned after the run (nothing wrote into spec/)
        run: python scripts/sync_spec.py --check --dest "$OPTIONS_SPEC_DIR"
